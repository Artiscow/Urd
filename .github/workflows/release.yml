# Release sync (ADR-0004): mirrors the contents of template/ into the clean
# urd-template repo ("Use this template") as ONE squashed commit per release,
# and tags the template repo with the version. That tag is the updater's
# checksum baseline (blob SHAs are compared against it), so the sync and the
# tagging happen in the same run and can never drift apart.
#
# Requires the secret URD_TEMPLATE_PAT: a fine-grained PAT with contents
# read/write ONLY on the template repo (GITHUB_TOKEN does not reach across
# repos). Actions are SHA-pinned with a version comment; the dependabot group
# actions-all keeps the pins fresh.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to sync (vX.Y.Z, must exist in the repo)'
        required: true
        type: string
      prerelease:
        description: 'Prerelease sync (rc): skips the CHANGELOG check'
        type: boolean
        default: false

permissions:
  contents: read

# One sync at a time: two concurrent runs would race for the template repo's HEAD.
concurrency:
  group: release-sync

env:
  TEMPLATE_REPO: Artiscow/urd-template

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and prerelease flag
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          REL_PRE: ${{ github.event.release.prerelease }}
          IN_TAG: ${{ inputs.tag }}
          IN_PRE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "tag=$REL_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=$REL_PRE" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$IN_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=$IN_PRE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Version consistency (engine == tag == CHANGELOG)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            node scripts/check-release.mjs "$TAG" --prerelease
          else
            node scripts/check-release.mjs "$TAG"
          fi

      - name: Engine and guard tests
        # A cheap smoke guard on exactly the content being synced; full CI
        # (build, validation, build match) has already run on the push behind
        # the tag.
        run: node --test tests/*.mjs

      - name: Check out the template repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TEMPLATE_REPO }}
          token: ${{ secrets.URD_TEMPLATE_PAT }}
          path: urd-template
          # Full history: pushing from a shallow clone is fragile, and the
          # template repo's history is small (one commit per release).
          fetch-depth: 0

      - name: Sync template/ as one squashed commit and tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          # Empty the working copy (everything but .git) and copy the template
          # in, so files deleted in template/ also disappear from the template repo.
          find urd-template -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -a template/. urd-template/
          cd urd-template
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No content changes since the last sync; tagging unchanged content.'
          else
            git commit -m "Urd $TAG"
          fi
          # Idempotent on a re-run: an existing tag is accepted only if it
          # already points at this content; otherwise the run stops (baseline
          # tags must never be moved silently).
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already exists and points correctly."
            else
              echo "ERROR: tag $TAG exists with different content." >&2
              exit 1
            fi
          else
            git tag "$TAG"
          fi
          # --atomic: branch and tag go together or not at all, so a manual
          # commit in the template repo can never leave a tag without content.
          git push --atomic origin HEAD "refs/tags/$TAG"

      - name: Publish the release notes to the template repo
        # The update panel shows the notes ("About vX.Y.Z"); they exist only
        # in the monorepo release, so they are copied here. Skipped on dispatch
        # (no release body) and tolerates the release already existing.
        if: github.event_name == 'release' && github.event.release.body != ''
        env:
          GH_TOKEN: ${{ secrets.URD_TEMPLATE_PAT }}
          TAG: ${{ steps.meta.outputs.tag }}
          BODY: ${{ github.event.release.body }}
          REPO: ${{ env.TEMPLATE_REPO }}
        run: |
          gh release create "$TAG" --repo "$REPO" --title "Urd $TAG" --notes "$BODY" \
            || gh release edit "$TAG" --repo "$REPO" --notes "$BODY"

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Engine and guard tests
        run: node --test tests/*.mjs

      - name: Install editor dependencies
        working-directory: editor
        run: npm ci

      - name: Validate example data against the schemas
        working-directory: editor
        run: npm run validate

      - name: Editor builds
        working-directory: editor
        run: npm run build

      - name: Committed editor build matches the source
        # The bundle in template/admin/assets is a build artefact that is
        # committed: if it differs from what the source actually produces, it
        # was either left unrebuilt or tampered with. Both must stop CI.
        run: git diff --exit-code -- template/admin/assets

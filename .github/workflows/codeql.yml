name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Dependabot PRs get a read-only token and cannot upload CodeQL
    # results; the analysis runs on push after the merge anyway.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The workflows are scanned as code of their own (actions): an expression that pours untrusted input into a shell step, or a token with more rights than its job needs.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # The committed editor bundle is GENERATED code (built from editor/src,
          # which is scanned): analysing the bundle raises alerts on unreadable
          # bundle lines, and every build shifts the line numbers so the alerts
          # reappear with new numbers.
          config: |
            paths-ignore:
              - template/admin/assets
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: '/language:${{ matrix.language }}'

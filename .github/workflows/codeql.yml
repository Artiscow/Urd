name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Dependabot PRs get a read-only token and cannot upload CodeQL
    # results; the analysis runs on push after the merge anyway.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          # The committed editor bundle is GENERATED code (built from editor/src,
          # which is scanned): analysing the bundle raises alerts on unreadable
          # bundle lines, and every build shifts the line numbers so the alerts
          # reappear with new numbers.
          config: |
            paths-ignore:
              - template/admin/assets
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:${{ matrix.language }}'

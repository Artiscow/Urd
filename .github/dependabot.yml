# Dependabot: automatiske PR-er for utdaterte avhengigheter.
# npm finnes kun i editor/ (Urd-nettsider har ingen avhengigheter).
version: 2
updates:
  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
      day: monday
    groups:
      # Mindre oppdateringer samles i én PR for å redusere støy
      utvikling-mindre:
        update-types: [minor, patch]

  # Workflowene SHA-pinner alle actions (forsyningskjede-vern: tags kan
  # flyttes, commit-SHA-er ikke); Dependabot leser versjonskommentaren
  # bak SHA-en og holder pinningene oppdatert.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Alle actions-bumper samles i én ukentlig PR
      actions-alle:
        patterns: ['*']

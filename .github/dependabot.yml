# Dependabot: automatic PRs for outdated dependencies.
# npm only exists in editor/ (Urd sites have no dependencies).
version: 2
updates:
  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
      day: monday
    groups:
      # Minor updates are grouped into one PR to reduce noise
      dev-minor:
        update-types: [minor, patch]

  # The workflows SHA-pin every action (supply-chain protection: tags can
  # move, commit SHAs cannot). Dependabot reads the version comment behind
  # the SHA and keeps the pins up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # All action bumps are grouped into one weekly PR
      actions-all:
        patterns: ['*']

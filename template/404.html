<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404</title>
  <!-- Urd-eid 404-side (SEO-pakken): verten serverer den for ukjente stier.
       Selvbærende med vilje: ingen motorreferanser, så den aldri må friskes
       opp ved motorbytte (ADR-0013); temafargene hentes fra theme.css med
       trygge fallbacker for ferske kloner. -->
  <link rel="stylesheet" href="/content/theme.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--urd-color-bg, #0b0e14);
      color: var(--urd-color-text, #e8eaf0);
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main { padding: 2rem; }
    .kode {
      margin: 0;
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      color: var(--urd-color-accent, #15b39a);
    }
    h1 { margin: 0.5rem 0 0.25rem; font-size: 1.4rem; }
    p { margin: 0.25rem 0; opacity: 0.75; }
    a {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      background: var(--urd-color-accent, #15b39a);
      color: var(--urd-color-bg, #0b0e14);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <p class="kode">404</p>
    <h1>Siden finnes ikke</h1>
    <p>Adressen peker på en side som ikke finnes. / This page does not exist.</p>
    <a href="/">Til forsiden</a>
  </main>
</body>
</html>
